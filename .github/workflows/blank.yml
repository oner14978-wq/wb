
name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-11-arm
    timeout-minutes: 360

    steps:
      # ==========================================
      # 1. BAIXAR O REPOSITORIO
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. INFORMACOES DO WINDOWS E HARDWARE
      # ==========================================
      - name: Show Windows and Hardware Information
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "======================================"
          Write-Host " WINDOWS E HARDWARE"
          Write-Host "======================================"

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber, OSArchitecture

          Get-CimInstance Win32_ComputerSystem |
            Select-Object Manufacturer, Model,
              @{Name="RAM_GB";Expression={[math]::Round($_.TotalPhysicalMemory / 1GB, 2)}}

          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{Name="FreeGB";Expression={[math]::Round($_.Free / 1GB, 2)}}

      # ==========================================
      # 3. ATIVAR RDP
      # ==========================================
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "Area de Trabalho Remota configurada."

      # ==========================================
      # 4. CRIAR CONTA RDP
      # ==========================================
      - name: Create RDP User
        shell: powershell
        env:
          RDP_USERNAME: "Rafael"
          RDP_PASSWORD: "P@ssw0rd!"
        run: |
          $ErrorActionPreference = "Stop"

          $username = $env:RDP_USERNAME
          $passwordText = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($passwordText)) {
            throw "A senha RDP nao foi definida."
          }

          $securePassword = ConvertTo-SecureString `
            $passwordText -AsPlainText -Force

          $user = Get-LocalUser -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -FullName $username `
              -Description "Conta para acesso RDP"
          } else {
            Set-LocalUser `
              -Name $username `
              -Password $securePassword
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "Conta RDP criada ou atualizada: $username"

      # ==========================================
      # 5. TESTAR CONECTIVIDADE
      # ==========================================
      - name: Check Network Connectivity
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          foreach ($hostname in @(
            "pkgs.tailscale.com",
            "controlplane.tailscale.com"
          )) {
            Write-Host "Testando HTTPS: $hostname"

            $result = Test-NetConnection `
              -ComputerName $hostname `
              -Port 443 `
              -WarningAction SilentlyContinue

            Write-Host "TCP 443 disponivel: $($result.TcpTestSucceeded)"
          }

      # ==========================================
      # 6. INSTALAR TAILSCALE
      # CORRIGIDO: ENDERECO OFICIAL DO INSTALADOR
      # ==========================================
      - name: Install Tailscale ARM64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $installerPath = Join-Path $env:TEMP "tailscale-setup.exe"
          $downloadUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"

          Write-Host "Baixando instalador oficial do Tailscale..."
          Write-Host $downloadUrl

          Invoke-WebRequest `
            -Uri $downloadUrl `
            -OutFile $installerPath `
            -UseBasicParsing

          if (!(Test-Path $installerPath)) {
            throw "O instalador do Tailscale nao foi baixado."
          }

          $installer = Get-Item $installerPath

          if ($installer.Length -lt 1MB) {
            throw "O arquivo baixado e muito pequeno. Verifique o download."
          }

          Write-Host "Download concluido: $([math]::Round($installer.Length / 1MB, 2)) MB"

          $process = Start-Process `
            -FilePath $installerPath `
            -ArgumentList "/quiet" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "O instalador do Tailscale falhou. Codigo: $($process.ExitCode)"
          }

          $possiblePaths = @(
            "$env:ProgramFiles\Tailscale\tailscale.exe",
            "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          )

          $tsExe = $possiblePaths |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -First 1

          if (!$tsExe) {
            $tsExe = Get-ChildItem `
              -Path $env:ProgramFiles `
              -Filter "tailscale.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (!$tsExe) {
            throw "Instalador executado, mas tailscale.exe nao foi encontrado."
          }

          "TAILSCALE_EXE=$tsExe" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $service = Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue

          if ($service) {
            Set-Service -Name "Tailscale" -StartupType Automatic
            Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue
          }

          & $tsExe version

          Write-Host "Tailscale instalado."
          Write-Host "Executavel localizado."

      # ==========================================
      # 7. AUTENTICAR E CONECTAR TAILSCALE
      # Requer o segredo TAILSCALE_AUTH_KEY
      # ==========================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "Configure TAILSCALE_AUTH_KEY nos secrets do repositorio."
          }

          $tsExe = $env:TAILSCALE_EXE

          if (!$tsExe -or !(Test-Path $tsExe)) {
            throw "Executavel do Tailscale nao encontrado."
          }

          $hostname = "rafael-rdp-${{ github.run_id }}"

          & $tsExe up `
            "--auth-key=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=$hostname" `
            "--accept-dns=false"

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao conectar o Tailscale."
          }

          $ip = $null

          for ($i = 1; $i -le 18; $i++) {
            Start-Sleep -Seconds 10

            $ip = (& $tsExe ip -4 2>$null |
              Select-Object -First 1)

            if ($ip -and $ip -match '^\d{1,3}(\.\d{1,3}){3}$') {
              break
            }

            Write-Host "Aguardando endereco IP ($i/18)..."
          }

          if (!$ip) {
            & $tsExe status
            throw "Nao foi possivel obter o IP do Tailscale."
          }

          "TAILSCALE_IPV4=$ip" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "TAILSCALE_HOSTNAME=$hostname" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Hostname Tailscale: $hostname"
          Write-Host "IP Tailscale: $ip"

      # ==========================================
      # 8. INSTALAR GOOGLE CHROME
      # ==========================================
      - name: Install Google Chrome
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget install `
              --id Google.Chrome `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements
          } else {
            Write-Host "winget nao esta disponivel."
          }

      # ==========================================
      # 9. INSTALAR 7-ZIP
      # ==========================================
      - name: Install 7-Zip
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget install `
              --id 7zip.7zip `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements
          } else {
            Write-Host "winget nao esta disponivel."
          }

      # ==========================================
      # 10. VERIFICAR RDP E TAILSCALE
      # ==========================================
      - name: Verify RDP and Tailscale
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "===== SERVICO RDP ====="
          Get-Service -Name TermService |
            Select-Object Name, Status, StartType

          $rdpPort = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          Write-Host "Porta local 3389: $($rdpPort.TcpTestSucceeded)"

          if ($env:TAILSCALE_EXE -and (Test-Path $env:TAILSCALE_EXE)) {
            & $env:TAILSCALE_EXE status
            & $env:TAILSCALE_EXE ip -4
          } else {
            Write-Host "Tailscale indisponivel para verificacao."
          }

      # ==========================================
      # 11. RELATORIO FINAL
      # ==========================================
      - name: Final RDP Report
        if: always()
        shell: powershell
        env:
          RDP_USERNAME: "Rafael"
          RDP_PASSWORD: "P@ssw0rd!"
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "         RELATORIO FINAL RDP"
          Write-Host "======================================"
          Write-Host "Usuario: $env:RDP_USERNAME"
          Write-Host "Senha configurada: $([bool]$env:RDP_PASSWORD)"
          Write-Host "Hostname Tailscale: $env:TAILSCALE_HOSTNAME"
          Write-Host "IP Tailscale: $env:TAILSCALE_IPV4"
          Write-Host "Status do job: ${{ job.status }}"
          Write-Host "======================================"
          
